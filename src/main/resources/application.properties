spring.application.name=microservice-monitor
server.port=${PORT:8080}
server.shutdown=graceful

# Comma-separated list of allowed origins (wildcards such as https://*.vercel.app are supported)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://*.vercel.app}

# Bounded in-memory log store
app.logs.max-entries=${LOG_MAX_ENTRIES:5000}

# Failure and latency simulation
app.simulation.payment-failure-rate=${PAYMENT_FAILURE_RATE:0.10}
app.simulation.min-latency-ms=${MIN_LATENCY_MS:30}
app.simulation.max-latency-ms=${MAX_LATENCY_MS:400}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
